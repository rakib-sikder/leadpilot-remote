<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LeadPilot</title>
<style>
/* Same tokens as the two sign-in pages. Three repositories, no shared
   stylesheet, kept identical by hand — this page and the one it hands you to
   have to look like the same place or the handover reads as a redirect to
   somewhere else. Two blues on purpose: white on #3B82F6 is 3.68:1 and fails on
   a button, so filled actions use #2563EB (5.17:1) and the lighter one is for
   accents and the focus ring. */
:root{
  --bg:#0B0F17;--surface:#192436;--line:#243047;
  --tx:#E8EDF5;--tx-dim:#94A3B8;--tx-faint:#7A89A2;
  --p:#2563EB;--p-lit:#3B82F6;--p-soft:rgba(59,130,246,.12);
  --ok:#34D399;--warn:#FBBF24;--bad:#F87171;
  --r:14px;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;
  padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#16223A 0,var(--bg) 60%);
  color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.card{width:min(100%,380px);padding:32px 28px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.mark{width:44px;height:44px;margin:0 auto 16px;display:grid;place-items:center;
  border-radius:12px;background:linear-gradient(140deg,#3B82F6,#7C3AED);
  font-weight:700;font-size:15px;letter-spacing:.02em;color:#fff}
h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em}
.sub{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--tx-dim)}

/* One row per machine — label, live status, its own Open button. Independent
   of each other on purpose: this page used to auto-pick one for you, but the
   whole point of the redesign is that the person, not a probe race, decides
   which machine to open. */
.opts{display:flex;flex-direction:column;gap:10px;margin:24px 0 0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:left}
.opt-info{flex:1;min-width:0}
.opt-name{font-size:14px;font-weight:600;color:var(--tx)}
.opt-status{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:12px;color:var(--tx-dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx-faint);flex:none}
.opt.checking .dot{background:var(--p-lit);animation:pulse 1.4s ease-in-out infinite}
.opt.online .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.14)}
.opt.offline .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.14)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.go{display:grid;place-items:center;flex:none;min-width:84px;height:38px;padding:0 14px;
  border-radius:9px;background:var(--p);color:#fff;text-decoration:none;
  font-weight:600;font-size:13.5px;transition:transform .12s ease,filter .12s ease,background .12s ease}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.97)}
.go:focus-visible{outline:2px solid var(--p-lit);outline-offset:2px}
.go[aria-disabled="true"]{opacity:1;pointer-events:none;background:rgba(255,255,255,.06);
  color:var(--tx-faint);border:1px solid var(--line)}

.foot{margin:18px 0 0;font-size:11.5px;line-height:1.5;color:var(--tx-faint)}
.retry{margin:14px 0 0;display:none;padding:10px 12px;border-radius:9px;font-size:12.5px;
  color:var(--bad);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25)}
.retry.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">LP</div>
  <h1>LeadPilot</h1>
  <p class="sub">Choose which machine to open.</p>

  <div class="opts">
    <div class="opt checking" id="optMain">
      <div class="opt-info">
        <div class="opt-name">Local (PC)</div>
        <div class="opt-status"><span class="dot" aria-hidden="true"></span><span id="mainText">Checking&hellip;</span></div>
      </div>
      <a class="go" id="goMain" href="#" aria-disabled="true">Checking&hellip;</a>
    </div>
    <div class="opt checking" id="optBackup">
      <div class="opt-info">
        <div class="opt-name">Backup (VPS)</div>
        <div class="opt-status"><span class="dot" aria-hidden="true"></span><span id="backupText">Checking&hellip;</span></div>
      </div>
      <a class="go" id="goBackup" href="#" aria-disabled="true">Checking&hellip;</a>
    </div>
  </div>

  <p class="foot">Same password on either one. Local has Messages, leads and settings; the backup has leads and screenshots only.</p>
  <div class="retry" id="retry" role="status" aria-live="polite">Neither machine is reachable right now. Retrying in <span id="retrySec">15</span>s&hellip;</div>
</main>
<script>
// Two independent options, not a race to pick one. Each machine is probed on
// its own and gets its own live status + its own "Open" button — the button is
// only ever clickable once ITS probe answered, so a person is never sent
// toward a machine this page already knows is down. See the two sign-in pages
// and the old auto-forwarding version of this file for why the probes work the
// way they do below (a dead quick tunnel still resolves and Cloudflare still
// answers it with its own error page, so only /api/ping or /ping — something
// only LeadPilot itself would return — counts as "up").
var BASE = '';
var CLOUDFLARE = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i;
var PROBE_MS = 6000;
var RETRY_MS = 15000;

function el(id) { return document.getElementById(id); }

function readState(file) {
  return fetch(BASE + file + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (s) {
      var url = String((s || {}).url || '').replace(/\/?$/, '/');
      return CLOUDFLARE.test(url) ? url : '';
    })
    .catch(function () { return ''; });
}

function probe(base, pingPath) {
  if (!base) return Promise.resolve(false);
  var settled = false;
  return new Promise(function (resolve) {
    var timer = setTimeout(function () {
      if (!settled) { settled = true; resolve(false); }
    }, PROBE_MS);
    fetch(base + pingPath + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (settled) return;
        settled = true; clearTimeout(timer);
        resolve(!!(j && j.app === 'leadpilot'));
      })
      .catch(function () {
        if (settled) return;
        settled = true; clearTimeout(timer);
        resolve(false);
      });
  });
}

function setOption(prefix, base, up) {
  var opt = el('opt' + prefix), text = el(prefix.toLowerCase() + 'Text'), go = el('go' + prefix);
  if (up && base) {
    opt.className = 'opt online';
    text.textContent = 'Online';
    go.href = base + 'login';
    go.rel = 'noreferrer noopener';
    go.textContent = 'Open';
    go.removeAttribute('aria-disabled');
  } else {
    opt.className = 'opt offline';
    text.textContent = 'Offline';
    go.href = '#';
    go.textContent = 'Offline';
    go.setAttribute('aria-disabled', 'true');
  }
}

function run() {
  el('retry').classList.remove('on');
  Promise.all([readState('leadpilot-url.json'), readState('vps-url.json')])
    .then(function (urls) {
      var mainBase = urls[0], backupBase = urls[1];
      return Promise.all([probe(mainBase, 'api/ping'), probe(backupBase, 'ping')])
        .then(function (up) {
          setOption('Main', mainBase, up[0]);
          setOption('Backup', backupBase, up[1]);
          if (!up[0] && !up[1]) scheduleRetry();
        });
    })
    .catch(function () {
      setOption('Main', '', false);
      setOption('Backup', '', false);
      scheduleRetry();
    });
}

function scheduleRetry() {
  var sec = RETRY_MS / 1000;
  el('retrySec').textContent = sec;
  el('retry').classList.add('on');
  var timer = setInterval(function () {
    sec -= 1;
    el('retrySec').textContent = sec;
    if (sec <= 0) { clearInterval(timer); run(); }
  }, 1000);
}

run();
</script>
</body>
</html>
