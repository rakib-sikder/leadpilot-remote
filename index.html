<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LeadPilot Remote</title>
  <style>
    :root{color-scheme:dark;--bg:#090e17;--card:#111a28;--line:#243044;
      --text:#eef2f7;--muted:#94a3b8;--blue:#2563eb;--green:#22c55e;
      --amber:#f59e0b;--red:#f87171}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;
      background:radial-gradient(circle at 50% 0,#13213a 0,var(--bg) 58%);
      color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:30px;border:1px solid var(--line);
      border-radius:18px;background:rgba(17,26,40,.96);
      box-shadow:0 22px 70px rgba(0,0,0,.35);text-align:center}
    .logo{width:52px;height:52px;margin:0 auto 16px;display:grid;place-items:center;
      border-radius:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:24px}
    h1{margin:0;font-size:23px;letter-spacing:-.02em}
    p{margin:8px 0 22px;color:var(--muted)}
    .status{display:flex;align-items:center;justify-content:center;gap:8px;
      margin-bottom:16px;color:var(--muted);font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}
    .status.main .dot{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
    .status.backup .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.12)}
    .status.offline .dot{background:var(--red)}
    a.go{display:block;padding:12px 16px;border-radius:10px;background:var(--blue);
      color:#fff;text-decoration:none;font-weight:650}
    a.go[aria-disabled="true"]{opacity:.55;cursor:wait}
    small{display:block;margin-top:16px;color:#64748b;font-size:11.5px}
  </style>
</head>
<body>
  <main>
    <div class="logo">&#128640;</div>
    <h1>LeadPilot Remote</h1>
    <p>One address. It finds whichever machine is running.</p>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Looking for your machines&hellip;</span></div>
    <a class="go" id="open" href="#" aria-disabled="true">Continue to sign-in</a>
    <small id="note">The password is the same on both.</small>
  </main>
  <script>
  // A forwarder, not a destination. The tunnel hostnames change every time
  // cloudflared restarts, so this address is the only stable one there is.
  //
  // There are two machines now: the PC does the work, and the VPS collects leads
  // while the PC is off. Whichever is up is where you want to go — and that is a
  // question this page cannot answer from the published files alone. The PC's
  // watchdog writes `online:false` when it shuts down cleanly, but a machine that
  // loses power, sleeps, or crashes never gets to write anything, so the file goes
  // on claiming the PC is up with an address that is no longer answering.
  //
  // So both are asked directly. A dead quick tunnel is NOT a dead hostname: the
  // name still resolves and Cloudflare still replies, with its own error page. Only
  // LeadPilot answers /ping with LeadPilot's own JSON, which is why that endpoint
  // exists and why it is open and CORS-enabled — it is the one question this page
  // is able to ask.
  //
  // The PC wins whenever both answer: it has the full app, and the VPS has only the
  // lead collector.
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const open = document.getElementById('open');
  const note = document.getElementById('note');
  const CLOUDFLARE = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i;
  const PROBE_MS = 6000;

  function readState(file) {
    return fetch(file + '?t=' + Date.now(), {cache: 'no-store'})
      .then(r => (r.ok ? r.json() : null))
      .then(s => {
        const url = String((s || {}).url || '').replace(/\/?$/, '/');
        return CLOUDFLARE.test(url) ? url : '';
      })
      .catch(() => '');
  }

  function probe(base, pingPath) {
    if (!base) return Promise.resolve(false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), PROBE_MS);
    return fetch(base + pingPath + '?t=' + Date.now(),
                 {cache: 'no-store', signal: ctrl.signal})
      .then(r => (r.ok ? r.json() : null))
      .then(j => !!(j && j.app === 'leadpilot'))
      .catch(() => false)
      .finally(() => clearTimeout(timer));
  }

  function send(base, kind) {
    const target = base + 'login';
    open.href = target;
    open.rel = 'noreferrer noopener';
    open.removeAttribute('aria-disabled');
    if (kind === 'main') {
      statusEl.className = 'status main';
      statusText.textContent = 'Main PC is online';
      note.textContent = 'Full app: Messages, leads and settings.';
    } else {
      statusEl.className = 'status backup';
      statusText.textContent = 'Main PC is off - using the backup server';
      note.textContent = 'Backup server: leads and screenshots only. Same password.';
      open.textContent = 'Continue to backup server';
    }
    setTimeout(() => { location.replace(target); }, kind === 'main' ? 350 : 1400);
  }

  Promise.all([readState('leadpilot-url.json'), readState('vps-url.json')])
    .then(([localUrl, vpsUrl]) => {
      statusText.textContent = 'Checking which machine is up\u2026';
      return Promise.all([
        probe(localUrl, 'api/ping'),
        probe(vpsUrl, 'ping'),
      ]).then(([localUp, vpsUp]) => {
        if (localUp) return send(localUrl, 'main');
        if (vpsUp)   return send(vpsUrl, 'backup');
        statusEl.className = 'status offline';
        statusText.textContent = 'Neither machine is reachable';
        note.textContent = 'Turn the PC on, or check the VPS. Retrying every 15s.';
        setTimeout(() => location.reload(), 15000);
      });
    })
    .catch(() => {
      statusEl.className = 'status offline';
      statusText.textContent = 'Could not read the published addresses';
      setTimeout(() => location.reload(), 15000);
    });
  </script>
</body>
</html>
