<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LeadPilot Remote</title>
  <style>
    :root{color-scheme:dark;--bg:#090e17;--card:#111a28;--line:#243044;
      --text:#eef2f7;--muted:#94a3b8;--blue:#2563eb;--green:#22c55e;--red:#f87171}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
      padding:22px;background:radial-gradient(circle at 50% 0,#13213a 0,var(--bg) 58%);
      color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,420px);padding:30px;border:1px solid var(--line);border-radius:18px;
      background:rgba(17,26,40,.96);box-shadow:0 22px 70px rgba(0,0,0,.35);text-align:center}
    .logo{width:52px;height:52px;margin:0 auto 16px;display:grid;place-items:center;
      border-radius:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);font-size:24px}
    h1{margin:0;font-size:23px;letter-spacing:-.02em}p{margin:8px 0 22px;color:var(--muted)}
    .status{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;
      color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
    .status.online .dot{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
    .status.offline .dot{background:var(--red)}
    a{display:block;padding:12px 16px;border-radius:10px;background:var(--blue);color:white;
      text-decoration:none;font-weight:650}a[aria-disabled="true"]{opacity:.55;cursor:wait}
    small{display:block;margin-top:16px;color:#64748b;font-size:11.5px}
  </style>
</head>
<body>
  <main>
    <div class="logo">💬</div>
    <h1>LeadPilot Remote</h1>
    <p>Secure access to Messages, leads and settings on your main PC.</p>
    <div class="status" id="status"><span class="dot"></span><span>Checking main PC…</span></div>
    <a id="open" href="#" aria-disabled="true">Open LeadPilot</a>
    <small>Your main PC and internet connection must remain on. A password is required.</small>
  </main>
  <script>
    const status = document.getElementById('status');
    const statusText = status.lastElementChild;
    const open = document.getElementById('open');
    let target = '';

    fetch('leadpilot-url.json?t=' + Date.now(), {cache:'no-store'})
      .then(response => {
        if (!response.ok) throw new Error('status unavailable');
        return response.json();
      })
      .then(state => {
        const url = String(state.url || '');
        if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/i.test(url)) {
          throw new Error('invalid remote address');
        }
        target = url;
        open.href = url;
        open.rel = 'noreferrer noopener';
        open.removeAttribute('aria-disabled');
        status.className = 'status ' + (state.online === false ? 'offline' : 'online');
        statusText.textContent = state.online === false ? 'Main PC is reconnecting' : 'Main PC is online';
      })
      .catch(() => {
        status.className = 'status offline';
        statusText.textContent = 'Main PC is offline';
      });

    open.addEventListener('click', event => {
      if (!target) event.preventDefault();
    });
  </script>
</body>
</html>
